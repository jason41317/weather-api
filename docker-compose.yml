services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weather-app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "8000:8000"
    depends_on:
      - redis
    command: php artisan serve --host=0.0.0.0 --port=8000

  redis:
    image: redis:latest
    container_name: weather-redis
    ports:
      - "6379:6379"